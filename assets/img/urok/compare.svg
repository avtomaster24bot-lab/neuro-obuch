<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="450" rx="22" fill="#0b0b26"/><text x="980" y="30" text-anchor="end" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#6b6b99">Схема</text><rect x="30" y="60" width="455" height="360" rx="18" fill="#1a0f22" stroke="#f87171" stroke-width="2"/><rect x="515" y="60" width="455" height="360" rx="18" fill="#0d1f1a" stroke="#4ade80" stroke-width="2"/><text x="257" y="100" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="800" fill="#f87171">✗ Слабый промпт</text><text x="742" y="100" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="800" fill="#4ade80">✓ Сильный промпт</text><rect x="60" y="130" width="395" height="60" rx="12" fill="#2a1630"/><text x="257" y="168" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="600" fill="#e9e9ff">«Напиши пост про кофе»</text><text x="70" y="235" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#fca5a5">— Шаблонный текст «для всех»</text><text x="70" y="277" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#fca5a5">— Нет цели и аудитории</text><text x="70" y="319" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#fca5a5">— Непонятный объём и формат</text><text x="70" y="361" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#fca5a5">— Приходится переделывать 5 раз</text><rect x="545" y="130" width="395" height="48" rx="12" fill="#12332a"/><text x="560" y="161" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#4ade80">Роль:</text><text x="692" y="161" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#d1fae5">ты SMM-копирайтер кофейни</text><rect x="545" y="188" width="395" height="48" rx="12" fill="#12332a"/><text x="560" y="219" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#4ade80">Задача:</text><text x="692" y="219" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#d1fae5">пост о новом рафе</text><rect x="545" y="246" width="395" height="48" rx="12" fill="#12332a"/><text x="560" y="277" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#4ade80">Контекст:</text><text x="692" y="277" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#d1fae5">мамы в декрете, Алматы</text><rect x="545" y="304" width="395" height="48" rx="12" fill="#12332a"/><text x="560" y="335" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#4ade80">Формат:</text><text x="692" y="335" text-anchor="start" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#d1fae5">до 600 знаков, 3 эмодзи, CTA</text><text x="742" y="395" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#4ade80">Результат с 1–2 попыток</text></svg>